name: Factory MCP host PowerShell candidate CI

on:
  push:
    branches:
      - hotfix/factory-mcp-host-powershell-v021-20260918
    paths:
      - "tools/csg/factory-mcp/**"
      - ".github/workflows/factory-mcp-host-powershell-ci.yml"
  pull_request:
    paths:
      - "tools/csg/factory-mcp/**"
      - ".github/workflows/factory-mcp-host-powershell-ci.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Provision Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: ""

      - name: Parse PowerShell transport and upgrade scripts
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $paths = @(
            'tools/csg/factory-mcp/src/invoke-hostguard.ps1',
            'tools/csg/factory-mcp/broker/hostguard-broker.ps1',
            'tools/csg/factory-mcp/broker/host-powershell-exec.ps1',
            'tools/csg/factory-mcp/tests/host-powershell-exec-smoke.ps1',
            'tools/csg/factory-mcp/windows/upgrade-host-powershell.ps1'
          )
          foreach ($path in $paths) {
            $tokens = $null
            $errors = $null
            [Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -ne 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              throw "POWERSHELL_PARSE_FAILED:$path"
            }
          }
          Write-Host 'FACTORY_MCP_POWERSHELL_PARSE=PASS'

      - name: Install locked Factory MCP dependencies
        shell: cmd
        working-directory: tools/csg/factory-mcp
        run: npm.cmd ci --ignore-scripts --no-audit --no-fund

      - name: Run Factory MCP protocol smoke
        shell: cmd
        working-directory: tools/csg/factory-mcp
        run: npm.cmd test
      - name: Run host PowerShell executor smoke
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'factory-mcp-host-exec-direct'
          $out = Join-Path $env:RUNNER_TEMP 'factory-mcp-host-exec-direct.json'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/csg/factory-mcp/tests/host-powershell-exec-smoke.ps1 -HelperPath tools/csg/factory-mcp/broker/host-powershell-exec.ps1 -OutputPath $out -WorkRoot $root
          if ($LASTEXITCODE -ne 0) { throw 'HOST_EXEC_DIRECT_SMOKE_FAILED' }
          $e = Get-Content -LiteralPath $out -Raw | ConvertFrom-Json
          if ($e.result -ne 'PASS' -or [int]$e.exit_code -ne 0 -or $e.timed_out -ne $false) { throw 'HOST_EXEC_DIRECT_SMOKE_NOT_PASS' }
          Write-Host ('HOST_EXEC_DIRECT_SMOKE=PASS run_as=' + $e.run_as)

      - name: Run host PowerShell executor as SYSTEM
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $taskName = 'PTYSD-CI-HostExec-' + [Guid]::NewGuid().ToString('N')
          $root = Join-Path $env:RUNNER_TEMP 'factory-mcp-host-exec-system'
          $out = Join-Path $env:RUNNER_TEMP 'factory-mcp-host-exec-system.json'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          Remove-Item -LiteralPath $out -Force -ErrorAction SilentlyContinue
          $smoke = (Resolve-Path 'tools/csg/factory-mcp/tests/host-powershell-exec-smoke.ps1').Path
          $helper = (Resolve-Path 'tools/csg/factory-mcp/broker/host-powershell-exec.ps1').Path
          $arg = '-NoProfile -NonInteractive -ExecutionPolicy Bypass -File "' + $smoke + '" -HelperPath "' + $helper + '" -OutputPath "' + $out + '" -WorkRoot "' + $root + '" -ExpectedRunAs "NT AUTHORITY\SYSTEM"'
          $action = New-ScheduledTaskAction -Execute 'powershell.exe' -Argument $arg
          $principal = New-ScheduledTaskPrincipal -UserId 'NT AUTHORITY\SYSTEM' -LogonType ServiceAccount -RunLevel Highest
          $settings = New-ScheduledTaskSettingsSet -StartWhenAvailable -ExecutionTimeLimit (New-TimeSpan -Minutes 2)
          try {
            Register-ScheduledTask -TaskName $taskName -Action $action -Principal $principal -Settings $settings | Out-Null
            Start-ScheduledTask -TaskName $taskName
            $deadline = (Get-Date).AddSeconds(45)
            do {
              Start-Sleep -Milliseconds 250
              $state = (Get-ScheduledTask -TaskName $taskName).State.ToString()
            } while ($state -eq 'Running' -and (Get-Date) -lt $deadline)
            if ($state -eq 'Running') { throw 'HOST_EXEC_SYSTEM_SMOKE_TIMEOUT' }
            $info = Get-ScheduledTaskInfo -TaskName $taskName
            if ([int]$info.LastTaskResult -ne 0) { throw ('HOST_EXEC_SYSTEM_TASK_FAILED:' + [string]$info.LastTaskResult) }
            if (-not (Test-Path -LiteralPath $out)) { throw 'HOST_EXEC_SYSTEM_OUTPUT_MISSING' }
            $e = Get-Content -LiteralPath $out -Raw | ConvertFrom-Json
            if ($e.result -ne 'PASS' -or $e.run_as -ne 'NT AUTHORITY\SYSTEM' -or [int]$e.exit_code -ne 0 -or $e.timed_out -ne $false) { throw 'HOST_EXEC_SYSTEM_SMOKE_NOT_PASS' }
            Write-Host 'HOST_EXEC_SYSTEM_SMOKE=PASS'
          } finally {
            Stop-ScheduledTask -TaskName $taskName -ErrorAction SilentlyContinue
            Unregister-ScheduledTask -TaskName $taskName -Confirm:$false -ErrorAction SilentlyContinue
          }

      - name: Verify host execution source boundary
        shell: powershell
        run: |
          $index = Get-Content tools/csg/factory-mcp/src/index.mjs -Raw
          $broker = Get-Content tools/csg/factory-mcp/broker/hostguard-broker.ps1 -Raw
          $helper = Get-Content tools/csg/factory-mcp/broker/host-powershell-exec.ps1 -Raw
          $upgrade = Get-Content tools/csg/factory-mcp/windows/upgrade-host-powershell.ps1 -Raw
          if ($index -notmatch "registerTool\(\s*'host_powershell'") { throw 'HOST_POWERSHELL_TOOL_MISSING' }
          if ($broker -notmatch "WindowsIdentity.*GetCurrent") { throw 'EXECUTION_IDENTITY_READBACK_MISSING' }
          if ($upgrade -notmatch 'NT AUTHORITY\\SYSTEM') { throw 'SYSTEM_EXECUTION_ACCEPTANCE_MISSING' }
          if ($broker -notmatch "script_sha256") { throw 'SCRIPT_DIGEST_RECEIPT_MISSING' }
          if ($broker -notmatch "host-powershell-exec.ps1") { throw 'SHARED_HOST_EXEC_HELPER_NOT_WIRED' }
          if ($helper -notmatch "Diagnostics.ProcessStartInfo") { throw 'ROBUST_PROCESS_EXECUTOR_MISSING' }
          if ($upgrade -notmatch "Invoke-SystemHostExecSelfTest") { throw 'SYSTEM_PREFLIGHT_MISSING' }
          if ($broker -notmatch "exec-receipts") { throw 'EXEC_RECEIPT_DIRECTORY_MISSING' }
          if ($upgrade -notmatch "Restore-Backup") { throw 'ROLLBACK_MISSING' }
          if ($upgrade -notmatch "SourceRef") { throw 'IMMUTABLE_SOURCE_REF_MISSING' }
          Write-Host 'FACTORY_MCP_HOST_EXEC_BOUNDARY=PASS'
