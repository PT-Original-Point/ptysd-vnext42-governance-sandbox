name: VNEXT4.5 Z4 WSMan listener shape probe

on:
  push:
    branches:
      - v45/z4-wsman-listener-shape-probe

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, windows, ptysd-governance-v45]
    timeout-minutes: 5
    steps:
      - name: Verify exact runner identity
        shell: cmd
        run: |
          if not "%RUNNER_NAME%"=="PTYSD-V45-CONTROL-01" exit /b 11
          if /I not "%RUNNER_OS%"=="Windows" exit /b 12
      - name: Enumerate WSMan listener resource read-only
        shell: cmd
        run: >-
          powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "$ErrorActionPreference='Stop'; $x=@(Get-WSManInstance -ResourceURI 'winrm/config/listener' -Enumerate); if($x.Count -ne 1){throw ('LISTENER_COUNT_INVALID='+$x.Count)}; $x | Select-Object Address,Transport,Port,Enabled,URLPrefix,ListeningOn | ConvertTo-Json -Depth 5"
