name: VNEXT4.5 self-hosted runner provider smoke

on:
  push:
    branches:
      - v45/runner-smoke-z2

permissions:
  contents: read

concurrency:
  group: v45-runner-smoke-z2
  cancel-in-progress: false

jobs:
  provider-smoke:
    runs-on: [self-hosted, windows, ptysd-governance-v45]
    timeout-minutes: 15
    steps:
      - name: Verify exact runner identity
        shell: cmd
        run: |
          if not "%RUNNER_NAME%"=="PTYSD-V45-CONTROL-01" exit /b 11
          if /I not "%RUNNER_OS%"=="Windows" exit /b 12
          echo V45_RUNNER_PROVIDER_SMOKE=IDENTITY_PASS
      - name: Checkout trusted governance commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Run deterministic V4.5 gates
        shell: cmd
        run: |
          node scripts/verify-v45-bounded.mjs
          if errorlevel 1 exit /b 21
          node --test tests/v45-bounded.test.mjs tests/v45-state-core.test.mjs tests/v45-runner-bootstrap.test.mjs
          if errorlevel 1 exit /b 22
          echo V45_RUNNER_PROVIDER_SMOKE=PASS
