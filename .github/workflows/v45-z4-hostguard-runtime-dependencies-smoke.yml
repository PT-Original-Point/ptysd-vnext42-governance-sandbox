name: VNEXT4.5 Z4 HostGuard runtime dependencies smoke

on:
  push:
    branches:
      - v45/z4-hostguard-runtime-dependencies-fix

permissions:
  contents: read

jobs:
  validate:
    runs-on: [self-hosted, windows, ptysd-governance-v45]
    timeout-minutes: 10
    steps:
      - name: Verify exact runner identity
        shell: cmd
        run: |
          if not "%RUNNER_NAME%"=="PTYSD-V45-CONTROL-01" exit /b 11
          if /I not "%RUNNER_OS%"=="Windows" exit /b 12
      - name: Checkout exact candidate without retaining credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Provision Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: ''
      - name: Run runtime dependency deterministic tests
        shell: cmd
        run: node --test tests/v45-hostguard-runtime-dependencies-reconcile.test.mjs
      - name: Parse runtime dependency reconciliation package
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "$e=$null;$t=$null;[Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/reconcile-v45-hostguard-runtime-dependencies.ps1'),[ref]$t,[ref]$e)|Out-Null;if($e.Count -ne 0){$e|%%{Write-Error $_.Message};exit 34};Write-Host 'PASS_V45_HOSTGUARD_RUNTIME_DEPENDENCIES_RECONCILE_PARSE'"
      - name: Validate HostGuard package without installing it
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/test-v45-hostguard-package.ps1
      - name: Verify complete HostGuard runtime dependencies on Windows PowerShell 5.1
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/test-v45-hostguard-runtime-dependencies.ps1
