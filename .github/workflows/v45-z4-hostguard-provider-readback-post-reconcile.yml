name: VNEXT4.5 Z4 HostGuard provider readback post reconcile

on:
  push:
    branches:
      - v45/z4-hostguard-provider-readback-post-reconcile

permissions:
  contents: read

jobs:
  hostguard-provider-readback:
    runs-on: [self-hosted, windows, ptysd-governance-v45]
    timeout-minutes: 10
    steps:
      - name: Verify exact runner identity
        shell: cmd
        run: |
          if not "%RUNNER_NAME%"=="PTYSD-V45-CONTROL-01" exit /b 11
          if /I not "%RUNNER_OS%"=="Windows" exit /b 12
      - name: Checkout exact smoke ref without retaining credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Verify HostGuard through JEA as runner service account
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/verify-v45-hostguard-provider-post-reconcile.ps1
