name: VNEXT4.5 Z4 HostGuard transport-aware functional acceptance

on:
  push:
    branches:
      - v45/z4-hostguard-transport-aware-acceptance

permissions:
  contents: read

jobs:
  accept-hostguard:
    runs-on: [self-hosted, windows, ptysd-governance-v45]
    timeout-minutes: 10
    steps:
      - name: Verify exact runner identity
        shell: cmd
        run: |
          if not "%RUNNER_NAME%"=="PTYSD-V45-CONTROL-01" exit /b 11
          if /I not "%RUNNER_OS%"=="Windows" exit /b 12
      - name: Invoke HostGuard JEA status and validate transport-aware identity
        shell: cmd
        run: >-
          powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "$ErrorActionPreference='Stop';$s=$null;try{$s=New-PSSession -ComputerName localhost -ConfigurationName PTYSD.HostGuard.V45 -EnableNetworkAccess -ErrorAction Stop;$r=Invoke-Command -Session $s -ScriptBlock { Get-PTYSDHostGuardStatus } -ErrorAction Stop;if(@($r).Count -ne 1){throw ('HOSTGUARD_OBJECT_COUNT_INVALID count='+@($r).Count)};if([string]$r.schema -ne 'v45.hostguard.status.v1'){throw ('HOSTGUARD_SCHEMA_MISMATCH actual='+[string]$r.schema)};if($r.PSObject.Properties.Match('host').Count -ne 1){throw 'HOSTGUARD_HOST_PROPERTY_MISSING'};$hostValue=[string]$r.host;$boot=[string]$r.boot_identity;if([string]::IsNullOrWhiteSpace($hostValue)){if($boot -notmatch '^DESKTOP-1B6PD2P\|'){throw ('HOSTGUARD_BOOT_IDENTITY_HOST_MISMATCH actual='+$boot)};$hostClass='HOST_FIELD_NULL_REMOTING_BOOT_IDENTITY_PINNED'}elseif($hostValue -ne 'DESKTOP-1B6PD2P'){throw ('HOSTGUARD_HOST_MISMATCH actual='+$hostValue)}else{$hostClass='HOST_FIELD_EXACT'};if(([string]$r.vm_name) -ne 'PTYSD-WORKER-01'){throw ('HOSTGUARD_VM_NAME_MISMATCH actual='+[string]$r.vm_name)};if(([string]$r.vm_id).ToLowerInvariant() -ne '881f7819-baa9-4a4e-8cca-8f6f18fb89a9'){throw ('HOSTGUARD_VM_ID_MISMATCH actual='+[string]$r.vm_id)};if([string]$r.vm_state -ne 'Running'){throw ('HOSTGUARD_VM_STATE_NOT_RUNNING actual='+[string]$r.vm_state)};if([string]$r.guest_ip -ne '172.31.253.10'){throw ('HOSTGUARD_GUEST_IP_MISMATCH actual='+[string]$r.guest_ip)};if(-not [bool]$r.ssh22_reachable){throw 'HOSTGUARD_SSH22_NOT_REACHABLE'};$runAs=[string]$r.run_as;if($runAs -notmatch '^WinRM Virtual Users\\WinRM VA_[0-9]+_WORKGROUP_DESKTOP-1B6PD2P\$$'){throw ('HOSTGUARD_RUN_AS_UNEXPECTED actual='+$runAs)};if([string]$r.PSComputerName -ne 'localhost'){throw ('HOSTGUARD_PS_COMPUTER_NAME_MISMATCH actual='+[string]$r.PSComputerName)};$j=[pscustomobject]@{schema=[string]$r.schema;host_field_classification=$hostClass;boot_identity=$boot;vm_name=[string]$r.vm_name;vm_id=[string]$r.vm_id;vm_state=[string]$r.vm_state;guest_ip=[string]$r.guest_ip;ssh22_reachable=[bool]$r.ssh22_reachable;run_as=$runAs;ps_computer_name=[string]$r.PSComputerName}|ConvertTo-Json -Compress -Depth 4;Write-Host ('HOSTGUARD_FUNCTIONAL_ACCEPTANCE='+$j);Write-Host 'PASS_V45_HOSTGUARD_PROVIDER_FUNCTIONAL_ACCEPTANCE'}finally{if($null -ne $s){Remove-PSSession -Session $s -ErrorAction SilentlyContinue}}"
