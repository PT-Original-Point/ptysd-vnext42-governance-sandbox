name: VNEXT4.5 Z4 JEA execution-policy formal smoke

on:
  push:
    branches:
      - v45/z4-jea-execution-policy-formal-smoke

permissions:
  contents: read

jobs:
  validate:
    runs-on: [self-hosted, windows, ptysd-governance-v45]
    timeout-minutes: 15
    steps:
      - name: Verify exact runner identity
        shell: cmd
        run: |
          if not "%RUNNER_NAME%"=="PTYSD-V45-CONTROL-01" exit /b 11
          if /I not "%RUNNER_OS%"=="Windows" exit /b 12
      - name: Checkout exact candidate without retaining credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Provision Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: ''
      - name: Run formal deterministic gates
        shell: cmd
        run: |
          node scripts/verify-v45-bounded.mjs
          if errorlevel 1 exit /b 21
          node --test tests/v45-bounded.test.mjs tests/v45-state-core.test.mjs tests/v45-runner-bootstrap.test.mjs tests/v45-z3-provider-evidence.test.mjs tests/v45-hostguard-static.test.mjs tests/v45-z4-hostguard-gate.test.mjs tests/v45-hostguard-access-reconcile.test.mjs tests/v45-hostguard-execution-policy-reconcile.test.mjs
          if errorlevel 1 exit /b 22
      - name: Validate HostGuard package without installing it
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/test-v45-hostguard-package.ps1
      - name: Parse caller-access reconciliation package
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "$e=$null;$t=$null;[Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/reconcile-v45-hostguard-jea-access.ps1'),[ref]$t,[ref]$e)|Out-Null;if($e.Count -ne 0){$e|%%{Write-Error $_.Message};exit 31};Write-Host 'PASS_V45_HOSTGUARD_ACCESS_RECONCILE_PARSE'"
      - name: Parse execution-policy reconciliation package
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "$e=$null;$t=$null;[Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/reconcile-v45-hostguard-jea-execution-policy.ps1'),[ref]$t,[ref]$e)|Out-Null;if($e.Count -ne 0){$e|%%{Write-Error $_.Message};exit 32};Write-Host 'PASS_V45_HOSTGUARD_EXECUTION_POLICY_RECONCILE_PARSE'"
