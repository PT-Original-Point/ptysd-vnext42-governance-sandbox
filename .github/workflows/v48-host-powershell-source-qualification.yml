name: V48 governed host PowerShell source qualification

on:
  push:
    branches:
      - v48-host-powershell-governed-candidate-20260918
      - v49-factory-mcp-control-lane-r1-20260919
    paths:
      - ".github/workflows/v48-host-powershell-source-qualification.yml"
      - "tools/csg/factory-mcp/**"
      - "tests/csg/v48-host-powershell-governance.test.mjs"
      - "tests/v46-profile-gates.test.mjs"

permissions:
  contents: read

jobs:
  qualify:
    concurrency:
      group: v48-host-powershell-source-qualification
      cancel-in-progress: true
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Verify isolated GitHub-hosted Windows runner
        shell: powershell
        run: |
          if ($env:RUNNER_OS -ne 'Windows') { throw 'RUNNER_OS_NOT_WINDOWS' }
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'RUNNER_NOT_GITHUB_HOSTED' }
          if ($env:RUNNER_NAME -eq 'PTYSD-V45-CONTROL-01') { throw 'PRIVILEGED_TRUSTED_RUNNER_FORBIDDEN_FOR_CANDIDATE_TESTS' }
          Write-Host 'V48_SOURCE_QUALIFICATION_ISOLATION=PASS'
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Provision Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: ""
      - name: Verify exact candidate commit
        shell: cmd
        run: |
          git rev-parse HEAD
      - name: Parse PowerShell source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $paths = @(
            'tools/csg/factory-mcp/src/invoke-hostguard.ps1',
            'tools/csg/factory-mcp/broker/hostguard-broker.ps1',
            'tools/csg/factory-mcp/broker/host-powershell-exec.ps1',
            'tools/csg/factory-mcp/tests/host-powershell-exec-smoke.ps1',
            'tools/csg/factory-mcp/windows/upgrade-host-powershell.ps1'
          )
          foreach ($path in $paths) {
            $tokens = $null
            $errors = $null
            [Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path),[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count -ne 0) { throw "POWERSHELL_PARSE_FAILED:$path" }
          }
          Write-Host 'V48_HOST_POWERSHELL_PARSE=PASS'
      - name: Install exact Factory MCP dependencies
        shell: cmd
        working-directory: tools/csg/factory-mcp
        run: npm.cmd ci --ignore-scripts --no-audit --no-fund
      - name: Check control-lane live smoke syntax
        shell: cmd
        working-directory: tools/csg/factory-mcp
        run: node --check tests/control-lane-concurrency-smoke.mjs
      - name: Run local protocol smoke
        shell: cmd
        working-directory: tools/csg/factory-mcp
        run: npm.cmd test
      - name: Run official Inspector modern stdio equivalence
        shell: cmd
        working-directory: tools/csg/factory-mcp
        run: npm.cmd run test:inspector
      - name: Run direct host executor smoke
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'v48-governed-host-exec'
          $out = Join-Path $env:RUNNER_TEMP 'v48-governed-host-exec.json'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/csg/factory-mcp/tests/host-powershell-exec-smoke.ps1 -HelperPath tools/csg/factory-mcp/broker/host-powershell-exec.ps1 -OutputPath $out -WorkRoot $root
          if ($LASTEXITCODE -ne 0) { throw 'HOST_EXEC_DIRECT_SMOKE_FAILED' }
          $e = Get-Content -LiteralPath $out -Raw | ConvertFrom-Json
          if ($e.result -ne 'PASS' -or [int]$e.exit_code -ne 0 -or $e.timed_out -ne $false) { throw 'HOST_EXEC_DIRECT_SMOKE_NOT_PASS' }
          Write-Host 'V48_HOST_EXEC_DIRECT=PASS'
      - name: Run governance regression
        shell: cmd
        run: node --test tests/v46-profile-gates.test.mjs tests/csg/v48-host-powershell-governance.test.mjs
