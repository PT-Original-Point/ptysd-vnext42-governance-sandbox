name: VNEXT4.5 Z4 HostGuard functional acceptance

on:
  push:
    branches:
      - v45/z4-hostguard-functional-acceptance

permissions:
  contents: read

jobs:
  accept-hostguard:
    runs-on: [self-hosted, windows, ptysd-governance-v45]
    timeout-minutes: 10
    steps:
      - name: Verify exact runner identity
        shell: cmd
        run: |
          if not "%RUNNER_NAME%"=="PTYSD-V45-CONTROL-01" exit /b 11
          if /I not "%RUNNER_OS%"=="Windows" exit /b 12
      - name: Invoke HostGuard JEA status as runner service account
        shell: cmd
        run: >-
          powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "$ErrorActionPreference='Stop';$s=$null;try{$s=New-PSSession -ComputerName localhost -ConfigurationName PTYSD.HostGuard.V45 -EnableNetworkAccess -ErrorAction Stop;$r=Invoke-Command -Session $s -ScriptBlock { Get-PTYSDHostGuardStatus } -ErrorAction Stop;if([string]$r.schema -ne 'v45.hostguard.status.v1'){throw ('HOSTGUARD_SCHEMA_MISMATCH actual='+[string]$r.schema)};if([string]$r.host -ne 'DESKTOP-1B6PD2P'){throw ('HOSTGUARD_HOST_MISMATCH actual='+[string]$r.host)};if(([string]$r.vm_name) -ne 'PTYSD-WORKER-01'){throw ('HOSTGUARD_VM_NAME_MISMATCH actual='+[string]$r.vm_name)};if(([string]$r.vm_id).ToLowerInvariant() -ne '881f7819-baa9-4a4e-8cca-8f6f18fb89a9'){throw ('HOSTGUARD_VM_ID_MISMATCH actual='+[string]$r.vm_id)};if([string]::IsNullOrWhiteSpace([string]$r.run_as)){throw 'HOSTGUARD_RUN_AS_EMPTY'};$j=$r|Select-Object schema,host,boot_identity,vm_name,vm_id,vm_state,guest_ip,ssh22_reachable,run_as|ConvertTo-Json -Compress -Depth 4;Write-Host ('HOSTGUARD_FUNCTIONAL_ACCEPTANCE='+$j);Write-Host 'PASS_V45_HOSTGUARD_PROVIDER_FUNCTIONAL_ACCEPTANCE'}finally{if($null -ne $s){Remove-PSSession -Session $s -ErrorAction SilentlyContinue}}"
