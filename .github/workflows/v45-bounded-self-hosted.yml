name: VNEXT4.5 bounded self-hosted synthetic gate

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Fixed synthetic gate mode
        required: true
        default: z2-noop
        type: choice
        options:
          - z2-noop

permissions:
  contents: read

concurrency:
  group: factory-governance-primary
  cancel-in-progress: false

jobs:
  z2-noop:
    if: ${{ inputs.mode == 'z2-noop' }}
    runs-on: [self-hosted, windows, ptysd-governance-v45]
    timeout-minutes: 20
    steps:
      - name: Checkout exact workflow ref without retaining credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Verify bounded V4.5 control contract
        shell: pwsh
        run: node scripts/verify-v45-bounded.mjs
      - name: Run deterministic V4.5 bounded tests
        shell: pwsh
        run: node --test tests/v45-bounded.test.mjs tests/v45-state-core.test.mjs
