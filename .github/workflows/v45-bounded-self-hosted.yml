name: VNEXT4.5 bounded self-hosted synthetic gate

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Fixed synthetic gate mode
        required: true
        default: z2-noop
        type: choice
        options:
          - z2-noop

permissions:
  contents: read

concurrency:
  group: factory-governance-primary
  cancel-in-progress: false

jobs:
  z2-noop:
    if: ${{ inputs.mode == 'z2-noop' }}
    runs-on: [self-hosted, windows, ptysd-governance-v45]
    timeout-minutes: 20
    steps:
      - name: Checkout exact workflow ref without retaining credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Provision Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: ''
      - name: Verify bounded V4.5 control contract
        shell: cmd
        run: node scripts/verify-v45-bounded.mjs
      - name: Run deterministic V4.5 bounded tests
        shell: cmd
        run: node --test tests/v45-bounded.test.mjs tests/v45-state-core.test.mjs tests/v45-runner-bootstrap.test.mjs tests/v45-z3-provider-evidence.test.mjs tests/v45-hostguard-static.test.mjs tests/v45-z4-hostguard-gate.test.mjs tests/v45-hostguard-access-reconcile.test.mjs tests/v45-hostguard-execution-policy-reconcile.test.mjs tests/v45-hostguard-hyperv-dependency-reconcile.test.mjs
      - name: Validate HostGuard package without installing it
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/test-v45-hostguard-package.ps1
      - name: Parse HostGuard caller access reconciliation package
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "$e=$null;$t=$null;[Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/reconcile-v45-hostguard-jea-access.ps1'),[ref]$t,[ref]$e)|Out-Null;if($e.Count -ne 0){$e|%%{Write-Error $_.Message};exit 31};Write-Host 'PASS_V45_HOSTGUARD_ACCESS_RECONCILE_PARSE'"
      - name: Parse HostGuard JEA execution-policy reconciliation package
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "$e=$null;$t=$null;[Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/reconcile-v45-hostguard-jea-execution-policy.ps1'),[ref]$t,[ref]$e)|Out-Null;if($e.Count -ne 0){$e|%%{Write-Error $_.Message};exit 32};Write-Host 'PASS_V45_HOSTGUARD_EXECUTION_POLICY_RECONCILE_PARSE'"
      - name: Verify omitted JEA execution-policy semantics on Windows PowerShell 5.1
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/test-v45-hostguard-execution-policy-prestate.ps1
      - name: Parse HostGuard Hyper-V dependency reconciliation package
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "$e=$null;$t=$null;[Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/reconcile-v45-hostguard-hyperv-dependency.ps1'),[ref]$t,[ref]$e)|Out-Null;if($e.Count -ne 0){$e|%%{Write-Error $_.Message};exit 33};Write-Host 'PASS_V45_HOSTGUARD_HYPERV_RECONCILE_PARSE'"
      - name: Verify Hyper-V required-module loading on Windows PowerShell 5.1
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/test-v45-hostguard-hyperv-dependency.ps1
