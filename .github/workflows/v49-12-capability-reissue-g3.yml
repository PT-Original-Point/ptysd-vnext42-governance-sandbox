name: V49-12 capability reissue g3

on:
  push:
    branches:
      - v49-12-capability-reissue-g3-20260919
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Compile exact generation-3 capability
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {compileCellCapability,assertCapabilityCurrent} from './tools/csg/cell-kernel/production-kernel.mjs';
          const contract=JSON.parse(fs.readFileSync('.qualification/v49-12/contract.json','utf8'));
          const fence=JSON.parse(fs.readFileSync('.qualification/v49-12/fence-g3.json','utf8'));
          const cap=compileCellCapability(contract,fence);
          assertCapabilityCurrent(cap,fence);
          if(!cap.execution_authorized) throw new Error('EXECUTION_NOT_AUTHORIZED');
          if(cap.fence_generation!==3) throw new Error('GENERATION_DRIFT');
          if(cap.owned_paths.join(',')!=='fixtures/v49-live-n1/src/slugify.mjs') throw new Error('OWNED_PATH_DRIFT');
          if(cap.resource_limits.provider_calls!==1||cap.resource_limits.network_mode!=='LIMITED') throw new Error('RESOURCE_DRIFT');
          console.log('V49_G3_CAPABILITY='+JSON.stringify(cap));
          NODE
